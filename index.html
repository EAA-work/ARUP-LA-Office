<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARUP LA Office - Interactive Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Controls -->
    <div class="controls">
        <button class="btn" id="layers-btn">🗂️ Layers</button>
        <button class="btn" id="routing-btn">🧭 Routes</button>
    </div>

    <!-- Layers Panel -->
    <div class="panel layers-panel" id="layers-panel">
        <h3>🗂️ Map Layers</h3>
        
        <div class="layer-group">
            <label>Base Maps</label>
            <div class="layer-item">
                <input type="radio" name="baseMap" value="osm" checked> OpenStreetMap
            </div>
            <div class="layer-item">
                <input type="radio" name="baseMap" value="hot"> OSM HOT
            </div>
            <div class="layer-item">
                <input type="radio" name="baseMap" value="topo"> Topographic
            </div>
        </div>

        <div class="layer-group">
            <label>Office Data</label>
            <div class="toggle" data-layer="office">
                <span>🏢 ARUP Office</span>
                <div class="switch on"></div>
            </div>
        </div>

        <div class="layer-group">
            <label>Layers</label>
            <div class="toggle" data-layer="buildings">
                <span>🏗️ Buildings</span>
                <div class="switch"></div>
            </div>
            <div class="toggle" data-layer="lines">
                <span>🛣️ Lines/Roads</span>
                <div class="switch"></div>
            </div>
            <div class="toggle" data-layer="points">
                <span>📍 Points of Interest</span>
                <div class="switch"></div>
            </div>
            <div class="toggle" data-layer="traffic-signals">
                <span>🚦 Traffic Signals</span>
                <div class="switch"></div>
            </div>
        </div>

        <div class="layer-group" id="dynamic-layers">
            <label>Point Categories</label>
            <!-- Dynamic layers will be added here -->
        </div>
    </div>

    <!-- Routing Panel -->
    <div class="panel routing-panel" id="routing-panel">
        <h3>🧭 Directions</h3>
        <input type="text" class="input" id="start" placeholder="📍 From">
        <input type="text" class="input" id="end" placeholder="🎯 To">
        <button class="route-btn primary" onclick="getRoute()">Get Route</button>
        <button class="route-btn secondary" onclick="clearRoute()">Clear Route</button>
        <div class="route-info" id="route-info"></div>
    </div>

    <!-- Floating Controls -->
    <div class="floating">
        <button class="btn" id="location-btn" title="My Location">📍</button>
        <button class="btn" id="office-btn" title="ARUP Office">🏢</button>
    </div>

    <!-- Status -->
    <div class="status" id="status">Ready</div>

    <!-- Map -->
    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.js"></script>
    <script src = "js/script.js"></script>
</body>
</html>
